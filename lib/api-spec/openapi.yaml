openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: easyteam
    description: EasyTeam integration endpoints
  - name: clients
    description: Daycare client and employee management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /easyteam/status:
    get:
      operationId: getEasyTeamStatus
      tags: [easyteam]
      summary: Get EasyTeam API connection status
      responses:
        "200":
          description: Status info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EasyTeamStatus"

  /easyteam/token:
    post:
      operationId: generateEasyTeamToken
      tags: [easyteam]
      summary: Generate EasyTeam auth token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateTokenRequest"
      responses:
        "200":
          description: Token generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateTokenResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /easyteam/webhook:
    post:
      operationId: receiveWebhook
      tags: [easyteam]
      summary: Receive webhook events from EasyTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"

  /easyteam/webhook/export:
    post:
      operationId: receiveExportWebhook
      tags: [easyteam]
      summary: Receive export webhook from EasyTeam via Convoy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportWebhookPayload"
      responses:
        "200":
          description: Export webhook received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
        "401":
          description: Invalid signature

  /easyteam/webhooks:
    get:
      operationId: getWebhookLogs
      tags: [easyteam]
      summary: Get stored webhook event logs
      responses:
        "200":
          description: Webhook log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookLogsResponse"

  /easyteam/exports:
    get:
      operationId: getExportLogs
      tags: [easyteam]
      summary: Get stored export webhook logs
      responses:
        "200":
          description: Export log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportLogsResponse"

  /easyteam/test-connection:
    post:
      operationId: testConnection
      tags: [easyteam]
      summary: Test EasyTeam API connection
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all daycare clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientsListResponse"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new daycare client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientRequest"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{clientId}:
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a daycare client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"

  /clients/{clientId}/employees:
    get:
      operationId: listClientEmployees
      tags: [clients]
      summary: List employees for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEmployeesListResponse"
    post:
      operationId: createClientEmployee
      tags: [clients]
      summary: Add an employee to a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEmployee"

  /clients/{clientId}/employees/{employeeId}:
    delete:
      operationId: deleteClientEmployee
      tags: [clients]
      summary: Remove an employee from a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"

  /clients/{clientId}/employees/{employeeId}/status:
    patch:
      operationId: updateClientEmployeeStatus
      tags: [clients]
      summary: Update an employee's status (hired/onboarding/active/terminated)
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeStatusRequest"
      responses:
        "200":
          description: Employee with updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEmployee"

  /clients/{clientId}/employees/{employeeId}/sync:
    post:
      operationId: syncClientEmployee
      tags: [clients]
      summary: Retry Rollfi and EasyTeam sync for an employee
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeSyncResponse"


components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    EasyTeamStatus:
      type: object
      properties:
        connected:
          type: boolean
        environment:
          type: string
        apiKeyPresent:
          type: boolean
        sdkVersion:
          type: string
        lastChecked:
          type: string
      required:
        - connected
        - environment
        - apiKeyPresent
        - sdkVersion
        - lastChecked

    GenerateTokenRequest:
      type: object
      properties:
        employee_id:
          type: string
        company_id:
          type: string
        client_id:
          type: string
        location_id:
          type: string
        organization_id:
          type: string
        role_name:
          type: string
        access_role:
          type: string
      required:
        - employee_id

    GenerateTokenResponse:
      type: object
      properties:
        token:
          type: string
        success:
          type: boolean
        error:
          type: string
      required:
        - success

    WebhookPayload:
      type: object
      properties:
        event:
          type: string
        employee_id:
          type: string
        timestamp:
          type: string
        data:
          type: object
          additionalProperties: true
      required:
        - event
      additionalProperties: true

    WebhookAck:
      type: object
      properties:
        received:
          type: boolean
        id:
          type: string
      required:
        - received
        - id

    ExportShift:
      type: object
      properties:
        id:
          type: string
        employeeId:
          type: string
        start:
          type: string
        end:
          type: string
        total_paid_hours_formatted:
          type: string
        total_paid_hours_decimal:
          type: string
        total_unpaid_hours_formatted:
          type: string
        total_unpaid_hours_decimal:
          type: string
      required:
        - id
        - employeeId
        - start
        - end

    ExportWebhookData:
      type: object
      properties:
        type:
          type: string
        organizationId:
          type: string
        requestedBy:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        locations:
          type: array
          items:
            type: string
        employees:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        url:
          type: string
      required:
        - type
        - organizationId
        - requestedBy
        - url

    ExportWebhookPayload:
      type: object
      properties:
        event_type:
          type: string
        data:
          $ref: "#/components/schemas/ExportWebhookData"
      required:
        - event_type
        - data

    ExportLogEntry:
      type: object
      properties:
        id:
          type: string
        receivedAt:
          type: string
        requestedBy:
          type: string
        organizationId:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        employeeCount:
          type: integer
        shiftCount:
          type: integer
        status:
          type: string
        signatureValid:
          type: boolean
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/ExportShift"
        error:
          type: string
      required:
        - id
        - receivedAt
        - requestedBy
        - organizationId
        - status
        - signatureValid

    ExportLogsResponse:
      type: object
      properties:
        exports:
          type: array
          items:
            $ref: "#/components/schemas/ExportLogEntry"
        total:
          type: integer
      required:
        - exports
        - total

    WebhookLogsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEvent"
        total:
          type: integer
      required:
        - events
        - total

    WebhookEvent:
      type: object
      properties:
        id:
          type: string
        event:
          type: string
        employee_id:
          type: string
        timestamp:
          type: string
        data:
          type: object
          additionalProperties: true
        status:
          type: string
      required:
        - id
        - event
        - timestamp
        - status

    ConnectionTestResult:
      type: object
      properties:
        apiConnection:
          type: boolean
        authentication:
          type: boolean
        webhook:
          type: boolean
        details:
          type: object
          additionalProperties: true
      required:
        - apiConnection
        - authentication
        - webhook

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required:
        - error

    Client:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        locationName:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        timezone:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - locationName
        - latitude
        - longitude
        - timezone
        - createdAt

    CreateClientRequest:
      type: object
      properties:
        name:
          type: string
        locationName:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        timezone:
          type: string
      required:
        - name
        - locationName

    ClientsListResponse:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/Client"
      required:
        - clients

    EmployeeStatus:
      type: string
      enum: [hired, onboarding, active, terminated]

    ClientEmployee:
      type: object
      properties:
        id:
          type: string
        clientId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        roleName:
          type: string
        wage:
          type: number
        wageType:
          type: string
        timeTrackingEnabled:
          type: boolean
        createdAt:
          type: string
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        easyteamSynced:
          type: boolean
        rollfiSynced:
          type: boolean
        rollfiUserId:
          type: string
        syncError:
          type: string
      required:
        - id
        - clientId
        - name
        - role
        - roleName
        - createdAt
        - status
        - easyteamSynced
        - rollfiSynced

    CreateEmployeeRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
        roleName:
          type: string
        wage:
          type: number
        wageType:
          type: string
        timeTrackingEnabled:
          type: boolean
        status:
          $ref: "#/components/schemas/EmployeeStatus"
      required:
        - name
        - role
        - roleName

    UpdateEmployeeStatusRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/EmployeeStatus"
      required:
        - status

    EmployeeSyncResponse:
      type: object
      properties:
        success:
          type: boolean
        rollfiSynced:
          type: boolean
        easyteamSynced:
          type: boolean
        rollfiUserId:
          type: string
        error:
          type: string
      required:
        - success
        - rollfiSynced
        - easyteamSynced

    ClientEmployeesListResponse:
      type: object
      properties:
        employees:
          type: array
          items:
            $ref: "#/components/schemas/ClientEmployee"
      required:
        - employees

    DeletedResponse:
      type: object
      properties:
        deleted:
          type: boolean
        id:
          type: string
      required:
        - deleted
        - id
